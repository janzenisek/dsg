name: Publish NuGet package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/DataStreamGenerator/DataStreamGenerator.csproj

      - name: Build
        run: dotnet build src/DataStreamGenerator/DataStreamGenerator.csproj --configuration Release --no-restore

      - name: Read Package Version
        id: version
        run: echo "package_version=$(dotnet msbuild src/DataStreamGenerator/DataStreamGenerator.csproj -getProperty:PackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack src/DataStreamGenerator/DataStreamGenerator.csproj --configuration Release --no-build --output ./artifacts

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet Push
        run: dotnet nuget push "./artifacts/DataStreamGenerator.${{ steps.version.outputs.package_version }}.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
